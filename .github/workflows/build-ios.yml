name: Build iOS IPA

on:
  workflow_dispatch:
    inputs:
      build_mode:
        description: 'نوع البناء (Build Mode)'
        required: true
        default: 'release'
        type: choice
        options:
          - release
          - profile
  push:
    branches:
      - main
      - master

jobs:
  build-ios:
    name: Build Flutter iOS (.ipa)
    runs-on: macos-14 # Apple Silicon M1 Runner with Xcode 15/16

    steps:
      # 1. Checkout Code
      - name: Checkout repository
        uses: actions/checkout@v4

      # 2. Detect Project Directory
      - name: Detect Project Directory
        id: dir-check
        run: |
          if [ -d "app-dashf" ]; then
            echo "PROJECT_PATH=app-dashf" >> $GITHUB_ENV
            echo "Working inside app-dashf directory"
          else
            echo "PROJECT_PATH=." >> $GITHUB_ENV
            echo "Working in root directory"
          fi

      # 3. Setup Java 17
      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      # 4. Setup Flutter SDK
      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      # 5. Verify Flutter & Doctor
      - name: Check Flutter Environment
        run: |
          flutter --version
          flutter doctor -v

      # 6. Install Flutter Dependencies
      - name: Install Flutter Packages
        working-directory: ${{ env.PROJECT_PATH }}
        run: |
          flutter pub get

      # 7. Install CocoaPods Dependencies
      - name: Install CocoaPods
        working-directory: ${{ env.PROJECT_PATH }}/ios
        run: |
          pod install --repo-update

      # 8. Build iOS Archive (Unsigned)
      - name: Build iOS Application (No Code Sign)
        working-directory: ${{ env.PROJECT_PATH }}
        run: |
          flutter build ios --release --no-codesign

      # 9. Package into .IPA (Payload format)
      - name: Package .IPA file
        working-directory: ${{ env.PROJECT_PATH }}/build/ios/iphoneos
        run: |
          mkdir -p Payload
          cp -r Runner.app Payload/
          zip -r -y app-dashf-unsigned.ipa Payload
          ls -lh app-dashf-unsigned.ipa
          echo "IPA Size:" $(du -sh app-dashf-unsigned.ipa)

      # 10. Upload .IPA Artifact to GitHub
      - name: Upload .IPA Artifact
        uses: actions/upload-artifact@v4
        with:
          name: app-dashf-ios-ipa
          path: ${{ env.PROJECT_PATH }}/build/ios/iphoneos/app-dashf-unsigned.ipa
          retention-days: 14
          if-no-files-found: error
