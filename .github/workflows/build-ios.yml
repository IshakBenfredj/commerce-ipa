name: Build iOS IPA & Android APK

on:
  workflow_dispatch:
    inputs:
      build_mode:
        description: 'نوع البناء (Build Mode)'
        required: true
        default: 'release'
        type: choice
        options:
          - release
          - profile
  push:
    branches:
      - main
      - master

jobs:
  # ── 1. Android APK Build Job ───────────────────────────────────────────────
  build-apk:
    name: Build Android (.apk)
    runs-on: ubuntu-latest # Fast and free Linux runner

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Detect Project Directory
        id: dir-check
        run: |
          if [ -d "app-dashf" ]; then
            echo "PROJECT_PATH=app-dashf" >> $GITHUB_ENV
          else
            echo "PROJECT_PATH=." >> $GITHUB_ENV
          fi

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Set up Flutter SDK
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Install Flutter Packages
        working-directory: ${{ env.PROJECT_PATH }}
        run: flutter pub get

      - name: Build Release APK
        working-directory: ${{ env.PROJECT_PATH }}
        run: flutter build apk --release

      - name: Build Split per ABI APKs (Smaller file size)
        working-directory: ${{ env.PROJECT_PATH }}
        run: flutter build apk --split-per-abi

      - name: Upload Universal APK
        uses: actions/upload-artifact@v4
        with:
          name: app-dashf-android-apk
          path: ${{ env.PROJECT_PATH }}/build/app/outputs/flutter-apk/app-release.apk
          retention-days: 14

      - name: Upload Split ARM64 APK (Optimized for modern phones)
        uses: actions/upload-artifact@v4
        with:
          name: app-dashf-android-arm64-apk
          path: ${{ env.PROJECT_PATH }}/build/app/outputs/flutter-apk/app-arm64-v8a-release.apk
          retention-days: 14

  # ── 2. iOS IPA Build Job ───────────────────────────────────────────────────
  build-ios:
    name: Build Flutter iOS (.ipa)
    runs-on: macos-14 # Apple Silicon M1 Runner with Xcode 15/16

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Detect Project Directory
        id: dir-check
        run: |
          if [ -d "app-dashf" ]; then
            echo "PROJECT_PATH=app-dashf" >> $GITHUB_ENV
          else
            echo "PROJECT_PATH=." >> $GITHUB_ENV
          fi

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Set up Flutter SDK
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Install Flutter Packages
        working-directory: ${{ env.PROJECT_PATH }}
        run: flutter pub get

      - name: Install CocoaPods
        working-directory: ${{ env.PROJECT_PATH }}/ios
        run: pod install --repo-update

      - name: Build iOS Application (No Code Sign)
        working-directory: ${{ env.PROJECT_PATH }}
        run: flutter build ios --release --no-codesign

      - name: Package .IPA file
        working-directory: ${{ env.PROJECT_PATH }}/build/ios/iphoneos
        run: |
          mkdir -p Payload
          cp -r Runner.app Payload/
          zip -r -y app-dashf-unsigned.ipa Payload

      - name: Upload .IPA Artifact
        uses: actions/upload-artifact@v4
        with:
          name: app-dashf-ios-ipa
          path: ${{ env.PROJECT_PATH }}/build/ios/iphoneos/app-dashf-unsigned.ipa
          retention-days: 14
